  <script data-cfasync="false" type="text/javascript" id="clever-core">
    (function (document, window) {
      var CLEVER_LOADER_ID = "CleverCoreLoader108241";
      var CLEVER_SRC = "https://scripts.cleverwebserver.com/97756ee41dacac40b1a5acade98daecf.js";
      var appObserver;

      // Clever calls the function named in data-callback-no-load (without
      // arguments) when it cannot find an ad for this visitor. Tell React so it
      // can swap the slot to Coinzilla and report the miss to GA4.
      var notifyNoFill = function (reason) {
        if (window.__cleverCoreNoFill) return;
        window.__cleverCoreNoFill = true;
        window.__cleverCoreNoFillReason = reason;
        if (appObserver) appObserver.disconnect();

        var detail = { reason: reason };
        var event;
        try {
          event = new CustomEvent("clever-core-no-load", { detail: detail });
        } catch (e) {
          event = document.createEvent("CustomEvent");
          event.initCustomEvent("clever-core-no-load", false, false, detail);
        }
        window.dispatchEvent(event);
      };

      window.onCleverCoreNoLoad = function () {
        notifyNoFill("callback-no-load");
      };

      var injectCleverCore = function () {
        if (document.getElementById(CLEVER_LOADER_ID)) return;

        var c = document.createElement("script");
        c.id = CLEVER_LOADER_ID;
        c.src = CLEVER_SRC;
        c.async = !0;
        c.type = "text/javascript";
        // data-target is only needed inside an iframe. On a top-level page an
        // unexpected window.name makes Clever look for a missing element and
        // silently skip the ad.
        var frame = window.frameElement;
        if (frame && frame.id) c.setAttribute("data-target", frame.id);
        c.setAttribute("data-callback", "put-your-callback-function-here");
        c.setAttribute("data-callback-url-click", "put-your-click-macro-here");
        c.setAttribute("data-callback-url-view", "put-your-view-macro-here");
        c.setAttribute("data-callback-no-load", "onCleverCoreNoLoad");

        var anchor = document.getElementsByTagName("script")[0] ||
          document.getElementsByTagName("head")[0] ||
          document.getElementsByTagName("body")[0];
        anchor.parentNode.insertBefore(c, anchor);
      };

      var boot = function () {
        // Once Clever reported no fill, React switches the slot to Coinzilla.
        if (window.__cleverCoreNoFill) {
          if (appObserver) appObserver.disconnect();
          return;
        }

        var slot = document.querySelector(".clever-core-ads");
        if (!slot) {
          if (document.querySelector("#top-ad-container .coinzilla") && appObserver) appObserver.disconnect();
          return;
        }
        if (slot.getAttribute("data-clever-bound") === "true") return;
        slot.setAttribute("data-clever-bound", "true");

        // React unmounts and remounts the slot during SPA navigation. The
        // CleverCore script is a singleton (re-injecting it is a no-op), so
        // ask the existing instance to look for the new slot instead.
        if (window.CleverCore && typeof window.CleverCore.exec === "function") {
          if (slot.childElementCount === 0) {
            try { window.CleverCore.exec(); } catch (e) { /* ignore */ }
          }
          return;
        }

        injectCleverCore();
      };

      // Keep observing: the ad slot is created, removed and re-created by React.
      // MutationObserver already batches records per microtask, so calling boot
      // directly is cheap. Do not use requestAnimationFrame here: it is paused
      // in background tabs and would delay the ad indefinitely.
      appObserver = new MutationObserver(boot);
      appObserver.observe(document.getElementById("root") || document.body, { childList: true, subtree: true });
      boot();
    })(document, window);
  </script>
  <script>
    // Ad-blocker detection
    // Sets 'ads-blocked' class on body — React components handle the UI.
    (function () {
      var bait = document.createElement('div');
      bait.className = 'adsbox';
      bait.setAttribute('aria-hidden', 'true');
      bait.style.cssText = 'position:absolute;top:-10000px;width:1px;height:1px';
      document.body.appendChild(bait);
      setTimeout(function () {
        var blocked = bait.offsetHeight === 0 || window.getComputedStyle(bait).display === 'none';
        bait.remove();
        if (blocked) document.body.classList.add('ads-blocked');
      }, 100);
    })();
  </script>
