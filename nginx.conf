server {
    listen 80;
    server_name localhost;

    # KÖK DİZİNİ BURAYA ALIYORUZ (Hepsine hükmeder)
    root /usr/share/nginx/html;
    index index.html;

    # Performans Ayarları
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Sıkıştırma
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # JS ve CSS için uzun süreli önbellekleme (Vite hash eklediği için güvenlidir)
    location ~* \.(js|css)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # "/" gets the pre-rendered English page (canonical /en); the app still redirects users by language
    location = / {
        try_files /root.html /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Blog list and posts: serve the SPA shell with the post's real <head> tags and article HTML
    # filled in from the backend (SSI), so crawlers and link previews don't need to run JS.
    location ~ "^/[a-z]{2}/blog(/[^/.]+)?/?$" {
        set $seo_page 1;
        set $seo_path $uri;  # try_files below rewrites $uri to /index.html
        ssi on;
        ssi_silent_errors on;  # backend down -> plain SPA shell instead of an error string
        try_files /index.html =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    location /__seo/ {
        internal;
        proxy_pass https://api.rollercoincalculator.app/api/Seo/;
        proxy_ssl_server_name on;
        proxy_set_header Host api.rollercoincalculator.app;
        proxy_set_header Accept-Encoding "";  # SSI can only include uncompressed bodies
        proxy_connect_timeout 3s;
        proxy_read_timeout 5s;
    }

    # Blog URLs change whenever a post is added, so this sitemap is generated by the backend
    location = /sitemap-blog.xml {
        proxy_pass https://api.rollercoincalculator.app/api/Seo/sitemap-blog.xml;
        proxy_ssl_server_name on;
        proxy_set_header Host api.rollercoincalculator.app;
    }

    location / {
        absolute_redirect off;
        try_files $uri $uri/index.html /index.html;
        # HTML dosyaları için önbelleği devre dışı bırak
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # Resim Önbellekleme
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # sw.js bloğu artık yukarıdaki root'u kullanacak
    location = /sw.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }
}