name: Deploy Rollercoin Frontend to VDS via GHCR

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Two merges close together ran two deploys at once; both recreated the same
# container on the VDS and one failed with a name conflict. Queue them instead
# (a newer pending run replaces an older pending one).
concurrency:
  group: deploy-frontend
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Kodu Cek
        uses: actions/checkout@v7

      - name: GHCR Giris
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Kullanici adini kucuk harfe cevir
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >>${GITHUB_ENV}

      # Layer cache (apt-get, npm install) needs the buildx driver
      - name: Buildx Kur
        uses: docker/setup-buildx-action@v4

      - name: Build ve Push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/${{ env.REPO_OWNER }}/rollercoin-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Compose Dosyasini VDS'e Kopyala
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.VDS_IP }}
          username: ${{ secrets.VDS_USER }} 
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "docker-compose.yml"
          target: "/home/app/RollercoinCalculatorWeb"

      - name: VDS Deploy (SSH)
        uses: appleboy/ssh-action@v1.2.5
        env:
          REPO_OWNER: ${{ env.REPO_OWNER }}
          GH_PAT: ${{ secrets.GH_PAT }}
        with:
          host: ${{ secrets.VDS_IP }}
          command_timeout: 30m  # room for waiting on the other deploy and pull retries
          username: ${{ secrets.VDS_USER }} 
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: REPO_OWNER, GH_PAT
          script: |
            set -eu
            echo "$GH_PAT" | docker login ghcr.io -u "$REPO_OWNER" --password-stdin
            
            # Proje klasörünü oluştur (yoksa) ve içine gir
            mkdir -p /home/app/RollercoinCalculatorWeb
            cd /home/app/RollercoinCalculatorWeb
            
            # Dinamik imaj ismini .env dosyasına yazdır (Küçük harf garantisi)
            echo "IMAGE_TAG=ghcr.io/$REPO_OWNER/rollercoin-frontend:latest" > .env
            
            # Backend and frontend deploy to the same VDS: run them one at a time, otherwise one's
            # image prune deletes the other's layers mid-extract ("failed to Lchown ... no such file").
            exec 9>/tmp/rollercoin-deploy.lock
            flock -w 900 9

            # GHCR downloads from the VDS (over IPv6) sometimes reset mid-layer. Docker resolves the
            # registry itself, so a pull can't be pinned to IPv4 here; finished layers are kept, so
            # retrying with a growing wait gets through.
            for attempt in 1 2 3 4 5 6 7 8; do
              docker pull ghcr.io/$REPO_OWNER/rollercoin-frontend:latest && break
              [ "$attempt" -eq 8 ] && exit 1
              echo "docker pull failed (attempt $attempt), retrying in $((attempt * 10))s"
              sleep $((attempt * 10))
            done
            
            # Sadece frontend servisini ayağa kaldır
            docker compose up -d --force-recreate rollercoin_frontend
            
            # Cleanup is optional; the lock above keeps it away from the backend deploy's pull.
            if ! docker image prune -f; then
              echo "Warning: Docker image cleanup failed; deployment commands completed." >&2
            fi
